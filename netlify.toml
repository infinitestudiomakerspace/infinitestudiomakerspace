# Infinite Maker Space — cấu hình Netlify
# Site tĩnh, không cần build. Pretty URLs bật sẵn theo mặc định nên
# /services tự động phục vụ file /services.html — giống hệt website mẫu.

[build]
  publish = "."
  command = ""

# Ảnh/logo: cache dài, tên file gần như không đổi.
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS: KHÔNG cache vĩnh viễn. Sửa giao diện là thấy đổi ngay,
# không phải đổi tên file mỗi lần. (Đã dính bẫy này 2 lần.)
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---- Chuyển hướng các trang đã gộp (2026-09-15) ----
# 6 trang chính sách + FAQ giờ nằm trong /policies, trang Location nằm dưới /contact.
# Giữ redirect để link cũ đã share hoặc đã được Google index không bị 404.
[[redirects]]
  from = "/policies/faq"
  to = "/policies#faq"
  status = 301

